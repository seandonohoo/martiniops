---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud
spec:
  chartRef:
    kind: OCIRepository
    name: opencloud
  interval: 1h
  values:
    networkpolicies:
      opencloud:
        type: cilium
        controller: opencloud
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "9200"
                    protocol: TCP
    controllers:
      opencloud:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Generates /etc/opencloud/opencloud.yaml (service secrets, random admin password) on first start only
          init-config:
            image: &image
              repository: docker.io/opencloudeu/opencloud
              tag: 7.2.6@sha256:196f4137f69fd81ad241c4a17eae13902da6aa70b2567ea7c51ef9ac235f4d96
            command:
              - /bin/sh
              - -c
              - "[ -f /etc/opencloud/opencloud.yaml ] || opencloud init"
            env:
              OC_INSECURE: "false"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            env:
              OC_URL: https://oc.martiniops.com
              OC_INSECURE: "false"
              OC_LOG_LEVEL: info
              # Envoy terminates TLS
              PROXY_TLS: "false"
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
              # posix keeps file metadata in xattrs, so /data has to be mounted over NFS 4.2 (see persistentvolume.yaml)
              STORAGE_USERS_DRIVER: posix
              STORAGE_USERS_POSIX_ROOT: /data
              IDM_CREATE_DEMO_USERS: "false"
              # Authentik replaces the built-in IdP; the built-in IDM stays as the user store for autoprovisioning
              OC_EXCLUDE_RUN_SERVICES: idp
              OC_OIDC_ISSUER: https://auth.martiniops.com/application/o/opencloud/
              OC_OIDC_CLIENT_ID: &clientId web
              OC_OIDC_CLIENT_SCOPES: openid profile email
              PROXY_OIDC_REWRITE_WELLKNOWN: "true"
              # Authentik issuers are per-provider, so every client shares the one "web" provider
              WEBFINGER_WEB_OIDC_CLIENT_ID: *clientId
              WEBFINGER_WEB_OIDC_CLIENT_SCOPES: openid profile email
              WEBFINGER_DESKTOP_OIDC_CLIENT_ID: *clientId
              WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: &offlineScopes openid profile email offline_access
              WEBFINGER_ANDROID_OIDC_CLIENT_ID: *clientId
              WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: *offlineScopes
              WEBFINGER_IOS_OIDC_CLIENT_ID: *clientId
              WEBFINGER_IOS_OIDC_CLIENT_SCOPES: *offlineScopes
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              # Key users on Authentik's stable `sub` so renaming a user in Authentik doesn't orphan their files
              PROXY_USER_OIDC_CLAIM: sub
              PROXY_AUTOPROVISION_CLAIM_USERNAME: sub
              PROXY_USER_CS3_CLAIM: username
              GRAPH_USERNAME_MATCH: none
              # Roles come from Authentik groups on every login (opencloudAdmin, opencloudSpaceAdmin,
              # opencloudUser, opencloudGuest); users in none of them are refused
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: groups
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
              SETTINGS_SETUP_DEFAULT_ASSIGNMENTS: "false"
              OC_ADMIN_USER_ID: ""
              WEB_OPTION_ACCOUNT_EDIT_LINK_HREF: https://auth.martiniops.com/if/user/
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status.php
                    port: &port 9200
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: *securityContext
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
      # Nightly restic backup of the user files to slownas. restic keeps the xattrs the posix driver stores
      # its metadata in, which a plain copy over slownas's NFS 4.1 would drop.
      backup:
        type: cronjob
        cronjob:
          schedule: 30 9 * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: docker.io/restic/restic
              tag: 0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
            env:
              RESTIC_REPOSITORY: /backup/restic/opencloud
              RESTIC_CACHE_DIR: /tmp/restic-cache
              RESTIC_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: kopiur-repository-secret
                    key: KOPIA_PASSWORD
            # Fixed --host: the pod's hostname changes every run, and forget groups snapshots by host
            command:
              - /bin/sh
              - -c
              - |
                set -e
                restic cat config >/dev/null 2>&1 || restic init
                restic backup /data --host opencloud
                restic forget --host opencloud --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
            securityContext: *securityContext
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 1Gi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: opencloud
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - oc.martiniops.com
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # Config, IDM (LDAP), NATS, search index, thumbnails and system metadata on Ceph, backed up by kopiur
      config:
        existingClaim: "{{ .Release.Name }}"
        # Only the opencloud pod: the PVC is RWO, so the backup job can't share it
        advancedMounts:
          opencloud:
            init-config: &configMounts
              - path: /etc/opencloud
                subPath: config
              - path: /var/lib/opencloud
                subPath: data
            app: *configMounts
      csp:
        type: configMap
        name: opencloud-configmap
        advancedMounts:
          opencloud:
            app:
              - path: /etc/opencloud/csp.yaml
                subPath: csp.yaml
                readOnly: true
      # User files on fastnas. Mounted outside /var/lib/opencloud: nesting it there makes the runtime
      # create a root-owned storage/ that OpenCloud can't add storage/metadata to.
      files:
        existingClaim: opencloud-files
        advancedMounts:
          opencloud:
            app:
              - path: /data
          backup:
            app:
              - path: /data
                readOnly: true
      fastnas-backup:
        type: nfs
        server: 10.26.10.20
        path: /volume1/fastnas-backup
        advancedMounts:
          backup:
            app:
              - path: /backup
      tmp:
        type: emptyDir

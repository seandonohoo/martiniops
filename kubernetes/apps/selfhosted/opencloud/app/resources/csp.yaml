# OpenCloud's default CSP plus auth.martiniops.com, which the web client talks to for OIDC
# (from opencloud-compose's config/opencloud/csp.yaml, minus the office/companion hosts we don't run).
directives:
  child-src:
    - "'self'"
  connect-src:
    - "'self'"
    - "blob:"
    - "https://auth.martiniops.com/"
    - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
    - "https://update.opencloud.eu/"
  default-src:
    - "'none'"
  font-src:
    - "'self'"
  frame-ancestors:
    - "'self'"
  frame-src:
    - "'self'"
    - "blob:"
    - "https://auth.martiniops.com/"
    - "https://embed.diagrams.net/"
  img-src:
    - "'self'"
    - "data:"
    - "blob:"
    - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
  manifest-src:
    - "'self'"
  media-src:
    - "'self'"
    - "blob:"
  object-src:
    - "'self'"
    - "blob:"
  script-src:
    - "'self'"
    - "'unsafe-inline'"
    - "https://auth.martiniops.com/"
  style-src:
    - "'self'"
    - "'unsafe-inline'"
    - "blob:"
  worker-src:
    - "'self'"
    - "blob:"

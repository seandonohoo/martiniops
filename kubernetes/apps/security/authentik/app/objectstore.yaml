---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/barmancloud.cnpg.io/objectstore_v1.json
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: authentik
spec:
  configuration:
    destinationPath: s3://cnpg/
    endpointURL: http://fastnas.martinirossi.net:8333
    s3Credentials:
      accessKeyId:
        name: authentik-barman-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: authentik-barman-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 4
  retentionPolicy: 14d
  instanceSidecarConfiguration:
    env:
      # Newer boto3 checksum headers aren't supported by all S3-compatible servers
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

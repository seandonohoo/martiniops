---
# BirdNET runs outside the cluster at 10.26.20.87:8080.
apiVersion: v1
kind: Service
metadata:
  name: birdnet
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: birdnet
  labels:
    kubernetes.io/service-name: birdnet
addressType: IPv4
ports:
  - name: http
    port: 8080
    protocol: TCP
endpoints:
  - addresses:
      - 10.26.20.87
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: birdnet
spec:
  hostnames:
    - birdnet.martiniops.com
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: birdnet
          port: 8080

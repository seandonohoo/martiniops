---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cloudnative-pg
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
    - datasourceName: __expr__
      inputName: DS_EXPRESSION
  # Vendored from https://grafana.com/grafana/dashboards/20417 (revision 4) with the backup panels switched
  # from cnpg_collector_* to the barman-cloud plugin's metrics. Update manually.
  configMapRef:
    name: cloudnative-pg-dashboard
    key: cloudnative-pg.json

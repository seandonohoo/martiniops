---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: CNPGInstanceDown
          expr: |-
            up{job="cnpg-system/cnpg-cluster"} == 0
          for: 5m
          annotations:
            summary: >-
              CNPG instance {{ $labels.namespace }}/{{ $labels.pod }} is not exposing metrics
          labels:
            severity: critical

        - alert: CNPGWALArchivingFailing
          expr: |-
            cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 15m
          annotations:
            summary: >-
              CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} is failing to archive WAL
          labels:
            severity: critical

        - alert: CNPGWALArchiveBacklog
          expr: |-
            cnpg_collector_pg_wal_archive_status{value="ready"} > 10
          for: 15m
          annotations:
            summary: >-
              CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} has {{ $value }} WAL segments waiting to be archived
          labels:
            severity: warning

        - alert: CNPGBackupFailed
          expr: |-
            barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp
              > barman_cloud_cloudnative_pg_io_last_available_backup_timestamp
          for: 5m
          annotations:
            summary: >-
              The most recent backup of CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} failed
          labels:
            severity: critical

        - alert: CNPGBackupStale
          expr: |-
            time() - barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 26 * 3600
          for: 30m
          annotations:
            summary: >-
              CNPG cluster {{ $labels.namespace }}/{{ $labels.cluster }} has no base backup in the last 26 hours
          labels:
            severity: critical

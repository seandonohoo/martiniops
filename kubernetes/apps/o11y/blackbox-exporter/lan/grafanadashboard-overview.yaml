---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: blackbox-exporter-overview
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  json: |
    {
      "title": "Network Paths Overview",
      "uid": "blackbox-exporter-overview",
      "tags": ["blackbox-exporter", "network"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          },
          {
            "name": "service",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
            "query": "label_values(probe_success, service)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "ISP1",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "min(probe_success{service=\"blackbox-exporter-isp1\", job=~\"probe/o11y/.*-icmp\"})", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "ISP2",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "min(probe_success{service=\"blackbox-exporter-isp2\", job=~\"probe/o11y/.*-icmp\"})", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "VPN",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "min(probe_success{service=\"blackbox-exporter-vpn\", job=~\"probe/o11y/.*-icmp\"})", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "LAN",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] }
            },
            "overrides": []
          },
          "targets": [
            { "expr": "min(probe_success{service=\"blackbox-exporter-lan\", job=~\"probe/o11y/.*-icmp\"})", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "ICMP Latency by Path",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "probe_duration_seconds{job=~\"probe/o11y/.*-icmp\", service=~\"$service\"}",
              "legendFormat": "{{service}} - {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "ICMP Success Rate (15m avg)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "avg_over_time(probe_success{job=~\"probe/o11y/.*-icmp\", service=~\"$service\"}[15m])",
              "legendFormat": "{{service}} - {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "DNS Lookup Time by Path",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "probe_dns_lookup_time_seconds{job=\"dns_probe\", service=~\"$service\"}",
              "legendFormat": "{{service}} - {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "title": "DNS Success Rate (15m avg)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "drawStyle": "line", "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "avg_over_time(probe_success{job=\"dns_probe\", service=~\"$service\"}[15m])",
              "legendFormat": "{{service}} - {{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "VPN HTTP Latency",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "drawStyle": "line", "fillOpacity": 10 } },
            "overrides": []
          },
          "targets": [
            {
              "expr": "probe_http_duration_seconds{job=\"probe/o11y/vpn-http\"}",
              "legendFormat": "{{phase}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "title": "VPN TLS Cert Expiry",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 7 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(probe_ssl_earliest_cert_expiry{job=\"probe/o11y/vpn-http\"} - time()) / 86400",
              "legendFormat": "days remaining",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "title": "Probe Target Detail",
          "type": "table",
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            {
              "expr": "probe_success{service=~\"$service\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "namespace": true } } }
          ]
        }
      ]
    }

---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./grafanadashboard.yaml
  - ./grafanadashboard-isp-latency.yaml
  - ./grafanadashboard-overview.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./probes.yaml
configMapGenerator:
  - name: blackbox-exporter-isp-latency-dashboard
    files:
      - isp-latency.json=./resources/isp-latency.json
generatorOptions:
  disableNameSuffixHash: true

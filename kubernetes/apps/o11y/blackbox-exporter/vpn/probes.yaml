---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: vpn-icmp
spec:
  module: icmp
  prober:
    url: blackbox-exporter-vpn.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1
        - 8.8.8.8
        - 9.9.9.9
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-vpn
      action: replace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: vpn-dns
spec:
  jobName: dns_probe
  module: dns
  prober:
    url: blackbox-exporter-vpn.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1:53
        - 8.8.8.8:53
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-vpn
      action: replace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: vpn-http
spec:
  module: http_2xx
  prober:
    url: blackbox-exporter-vpn.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://one.one.one.one
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-vpn
      action: replace

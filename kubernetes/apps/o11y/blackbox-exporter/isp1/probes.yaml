---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: isp1-icmp
spec:
  module: icmp
  prober:
    url: blackbox-exporter-isp1.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1
        - 8.8.8.8
        - 9.9.9.9
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-isp1
      action: replace
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: isp1-dns
spec:
  jobName: dns_probe
  module: dns
  prober:
    url: blackbox-exporter-isp1.o11y.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 1.1.1.1:53
        - 8.8.8.8:53
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-isp1
      action: replace

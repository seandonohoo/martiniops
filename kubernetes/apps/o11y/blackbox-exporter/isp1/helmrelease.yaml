---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter-isp1
spec:
  chartRef:
    kind: OCIRepository
    name: blackbox-exporter-isp1
  interval: 1h
  values:
    fullnameOverride: blackbox-exporter-isp1
    podAnnotations:
      k8s.v1.cni.cncf.io/networks: |-
        [{
          "name": "srvr",
          "namespace": "kube-system",
          "ips": ["10.26.10.249/24"],
          "mac": "3e:d0:83:c0:8e:24"
        }]
    config:
      modules:
        dns:
          prober: dns
          timeout: 5s
          dns:
            preferred_ip_protocol: ip4
            query_name: cloudflare.com
            query_type: A
            valid_rcodes:
              - NOERROR
        http_2xx:
          prober: http
          timeout: 5s
          http:
            valid_http_versions:
              - HTTP/1.1
              - HTTP/2.0
            follow_redirects: true
            preferred_ip_protocol: ip4
        icmp:
          prober: icmp
          timeout: 5s
          icmp:
            preferred_ip_protocol: ip4
        tcp_connect:
          prober: tcp
          timeout: 5s
          tcp:
            preferred_ip_protocol: ip4
    serviceMonitor:
      enabled: true
      selfMonitor:
        enabled: true
    prometheusRule:
      enabled: true
      rules:
        - alert: Isp1ProbeFailed
          expr: |-
            probe_success{service="blackbox-exporter-isp1"} == 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: |-
              The probe targeting {{ $labels.instance }} is currently having connectivity issues

---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: pushover
    repeatInterval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Every alert also goes to Slack; continue so the Pushover route below still gets it.
      # Watchdog is always firing, so it stays out of the channel.
      # Once a child route matches, the root receiver is no longer used as a fallback, so Pushover needs
      # its own catch-all route below.
      - receiver: slack
        continue: true
        matchers:
          - name: alertname
            value: Watchdog
            matchType: "!="
      # - receiver: buddy-heartbeat
      #   groupInterval: 2m
      #   groupWait: 0s
      #   repeatInterval: 2m30s
      #   matchers:
      #     - name: alertname
      #       value: Watchdog
      #       matchType: =
      - receiver: pushover
        matchers:
          - name: alertname
            value: .+
            matchType: =~
    groupBy:
      - alertname
      - cluster
      - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =

  receivers:
    - name: blackhole
    # - name: buddy-heartbeat
    #   webhookConfigs:
    #     - httpConfig:
    #         bearerTokenSecret:
    #           name: alertmanager-secret
    #           key: BUDDY_HEARTBEAT_TOKEN
    #       urlSecret:
    #         name: alertmanager-secret
    #         key: BUDDY_HEARTBEAT_URL
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          monospace: false
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          ttl: 86400s
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          urlTitle: View in Alertmanager
    - name: slack
      slackConfigs:
        - apiURL:
            name: alertmanager-secret
            key: SLACK_WEBHOOK_URL
          sendResolved: true
          color: >-
            {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ else }}good{{ end }}
          title: >-
            [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
          titleLink: https://alertmanager.martiniops.com
          text: |-
            {{- range .Alerts }}
            {{- if ne .Annotations.description "" }}
            • {{ .Annotations.description }}
            {{- else if ne .Annotations.summary "" }}
            • {{ .Annotations.summary }}
            {{- else if ne .Annotations.message "" }}
            • {{ .Annotations.message }}
            {{- else }}
            • Alert description not available
            {{- end }}
              {{- range .Labels.SortedPairs }}{{ if ne .Name "alertname" }} `{{ .Name }}={{ .Value }}`{{ end }}{{ end }}
            {{- end }}

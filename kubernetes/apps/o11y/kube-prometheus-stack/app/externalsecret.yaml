---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    template:
      data:
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        SLACK_WEBHOOK_URL: "{{ .SLACK_WEBHOOK_URL }}"
  dataFrom:
    - extract:
        key: alertmanager
    - extract:
        key: pushover
    # - extract:
    #     key: gatus
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-prometheus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant-prometheus-secret
    template:
      data:
        HASS_PROMETHEUS_TOKEN: "{{ .HASS_PROMETHEUS_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant

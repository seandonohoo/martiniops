---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app json-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: json-exporter
  interval: 1h
  values:
    controllers:
      json-exporter:
        containers:
          app:
            image:
              repository: quay.io/prometheuscommunity/json-exporter
              tag: v0.7.0
            args:
              - --config.file=/etc/json_exporter/config.yml
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 7979
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
    configMaps:
      config:
        data:
          config.yml: |-
            modules:
              xgs_pon:
                http_client_config:
                  tls_config:
                    insecure_skip_verify: true
                metrics:
                  - name: xgspon_cpu1_temperature_celsius
                    help: CPU1 temperature in Celsius
                    path: "{ .cpu1_tempC }"
                  - name: xgspon_cpu2_temperature_celsius
                    help: CPU2 temperature in Celsius
                    path: "{ .cpu2_tempC }"
                  - name: xgspon_module_voltage_volts
                    help: Module voltage in Volts
                    path: "{ .module_voltage }"
                  - name: xgspon_optic_temperature_celsius
                    help: Optic temperature in Celsius
                    path: "{ .optic_tempC }"
                  - name: xgspon_ploam_state
                    help: PLOAM state
                    path: "{ .ploam_state }"
                  - name: xgspon_rx_power_dbm
                    help: RX optical power in dBm
                    path: "{ .rx_power_dBm }"
                  - name: xgspon_tx_bias_milliamps
                    help: TX bias current in mA
                    path: "{ .tx_bias_mA }"
                  - name: xgspon_tx_power_dbm
                    help: TX optical power in dBm
                    path: "{ .tx_power_dBm }"
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/json_exporter/config.yml
            subPath: config.yml
